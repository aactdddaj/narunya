<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9c0e7"><title>🍥 Нарунья 3.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#45394d;background:#faf4fb}*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:760px;margin:auto}header,.stats,.toolbar,.panel{background:#fff;border:2px solid #eddcf2;border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 4px 14px #866c9820}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.5rem;margin:0}p{margin:5px 0;color:#806c88}.coins{font-size:1.15rem;font-weight:700;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:.82rem}.meter{height:9px;border-radius:20px;background:#f0e7f2;margin-top:7px;overflow:hidden}.meter span{display:block;height:100%;background:#d9a6d8;transition:width .25s}.room{height:330px;border:4px solid #f2d9ed;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(#e8d9f6 0 73%,#cdaac6 73%);transition:background .3s}.room.night{background:linear-gradient(#655878 0 73%,#8e7695 73%)}.window{position:absolute;right:6%;top:20px;width:120px;height:120px;border:9px solid #fff1df;border-radius:17px;background:linear-gradient(#7a8fb6,#d3c7e3);overflow:hidden}.window:after{content:'✦   ☾';position:absolute;left:12px;top:15px;color:white;font-size:22px}.room:not(.night) .window:after{content:'☁️  ☁️'}.rain{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 18px,#ffffff75 19px 20px,transparent 21px 40px);animation:rain 1.5s linear infinite;opacity:.6}.room:not(.raining) .rain{display:none}@keyframes rain{to{transform:translateY(40px)}}.shelf{position:absolute;top:22px;left:17px;font-size:33px}.rug{position:absolute;bottom:16px;left:20%;width:60%;height:56px;background:#f7e5f1;border-radius:50%;box-shadow:0 5px #b68aa9}.bed{position:absolute;bottom:45px;left:18px;font-size:48px}.cat{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);font-size:102px;cursor:pointer;user-select:none;filter:drop-shadow(0 7px 4px #0002);line-height:1}.cat.jump{animation:jump .4s}@keyframes jump{50%{transform:translate(-50%,-22px) rotate(-8deg)}}.hat{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:48px}.speech{position:absolute;left:15px;top:15px;max-width:52%;background:#fff9f2;border-radius:18px;padding:10px;font-size:.85rem}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{border:1px solid #ddc8e5;background:#f7e8f9;color:#493c50;padding:12px 8px;border-radius:13px;font:inherit;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button.active{background:#dfb9eb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{min-height:65px;text-align:left}.item small{display:block;color:#836b8d;margin-top:3px}.note{font-size:.83rem;color:#806c88}footer{text-align:center;font-size:.8rem;color:#8e7b97;margin:20px 0}input[type=file]{display:none}@media(max-width:440px){body{padding:9px}.room{height:290px}.cat{font-size:86px}.toolbar{grid-template-columns:repeat(2,1fr)}.stats{gap:6px;font-size:.73rem}.window{width:95px;height:95px}.speech{font-size:.76rem}}
</style></head><body><main class="app"><header><div><h1>🍥 Нарунья 3.0</h1><p>Маленький домик большого счастья</p></div><div class="coins" id="coins">💗 2002</div></header><section class="stats"><div>🥰 Счастье <b id="happyN"></b><div class="meter"><span id="happy"></span></div></div><div>🍡 Сытость <b id="foodN"></b><div class="meter"><span id="food"></span></div></div><div>⚡ Энергия <b id="energyN"></b><div class="meter"><span id="energy"></span></div></div></section><div class="room raining" id="room"><div class="window"><div class="rain"></div></div><div class="shelf" id="shelf">🪴🧸</div><div class="rug"></div><div class="bed" id="bed">🛏️</div><div class="speech" id="speech">Нья! Добро пожаловать домой! ♡</div><div class="cat" id="cat" role="button" tabindex="0" aria-label="Погладить Нарунью"><span class="hat" id="hat"></span><span id="face">🐱</span></div><div style="position:absolute;right:13px;bottom:10px;font-size:28px">🍓🌷</div></div><section class="toolbar"><button data-act="pat">🫳 Погладить</button><button data-act="feed">🍡 Моти</button><button data-act="play">🧶 Поиграть</button><button data-act="sleep">🌙 Сон</button><button data-act="rain">🌧️ Дождик</button><button data-act="gift">🎁 Подарок</button></section><nav class="tabs"><button data-tab="outfits" class="active">🎀 Наряды</button><button data-tab="shop">🛍️ Магазин</button><button data-tab="tasks">🏆 Задания</button><button data-tab="diary">📖 Дневник</button><button data-tab="save">💾 Сохранения</button></nav><section class="panel" id="panel"></section><footer>Нарунья сохраняется в этом браузере автоматически ♡</footer></main><script>
(()=>{'use strict';const KEY='narunya-v3-save';const items=[{id:'none',name:'Без шапочки',emoji:'',cost:0},{id:'bow',name:'Розовый бантик',emoji:'🎀',cost:0},{id:'scara',name:'Шляпа Сказителя',emoji:'👒',cost:25},{id:'crown',name:'Корона',emoji:'👑',cost:60},{id:'flower',name:'Цветочек',emoji:'🌸',cost:20},{id:'sleepcap',name:'Ночной колпачок',emoji:'🌙',cost:30},{id:'star',name:'Звёздочка',emoji:'⭐',cost:45}];const initial=()=>({version:3,coins:2002,happy:100,food:100,energy:90,hat:'bow',owned:['none','bow'],rain:true,sleep:false,plays:0,pats:0,feeds:0,gifts:0,diary:['Нарунья переехал в свой новый домик! 🍥'],claimed:[]});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY))}}catch{state=initial()}let tab='outfits';const $=id=>document.getElementById(id);const clamp=n=>Math.max(0,Math.min(100,n));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};function log(t){state.diary.unshift(new Date().toLocaleDateString('ru-RU')+' · '+t);state.diary=state.diary.slice(0,30)}function say(t){$('speech').textContent=t;$('cat').classList.remove('jump');void $('cat').offsetWidth;$('cat').classList.add('jump')}function update(){for(const k of ['happy','food','energy']){$(k).style.width=state[k]+'%';$(k+'N').textContent=state[k]+'%'}$('coins').textContent='💗 '+state.coins;$('hat').textContent=items.find(i=>i.id===state.hat)?.emoji||'';$('face').textContent=state.sleep?'😴':state.happy<30?'😿':'🐱';$('room').classList.toggle('night',state.sleep);$('room').classList.toggle('raining',state.rain);save();renderPanel()}function act(a){if(a!=='sleep')state.sleep=false;switch(a){case'pat':state.pats++;state.happy=clamp(state.happy+8);state.coins+=2;say('Мррр! Ещё погладь! ♡');break;case'feed':state.feeds++;state.food=clamp(state.food+18);state.happy=clamp(state.happy+3);say('МОТИИИ! НЯМ! 🍡');break;case'play':if(state.energy<10){say('Нья… сначала посплю 💤');update();return}state.plays++;state.energy=clamp(state.energy-10);state.food=clamp(state.food-5);state.happy=clamp(state.happy+12);state.coins+=5;say('Я ПОБЕДИЛ КЛУБОК! >:з');break;case'sleep':state.sleep=!state.sleep;state.energy=clamp(state.energy+30);say(state.sleep?'Спокойной ночи… zZz 🌙':'Нья! Я проснулся!');break;case'rain':state.rain=!state.rain;say(state.rain?'Слушай, как стучит дождик… 🌧️':'Выглянуло солнышко! ☀️');break;case'gift':state.gifts++;state.coins+=8;say('Подарочек! +8 сердечек 🎁');break}update()}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$('cat').onclick=()=>act('pat');$('cat').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('pat')}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderPanel()});function button(label,cb,disabled=false){const b=document.createElement('button');b.className='item';b.textContent=label;b.disabled=disabled;b.onclick=cb;return b}function renderPanel(){const p=$('panel');p.replaceChildren();const heading=document.createElement('h3');heading.style.margin='0 0 10px';heading.textContent={outfits:'🎀 Гардероб',shop:'🛍️ Магазин нарядов',tasks:'🏆 Задания',diary:'📖 Дневник Наруньи',save:'💾 Сохранения'}[tab];p.append(heading);if(['outfits','shop'].includes(tab)){const grid=document.createElement('div');grid.className='grid';for(const i of items){const has=state.owned.includes(i.id);if(tab==='outfits'&&!has||tab==='shop'&&has)continue;grid.append(button((i.emoji||'🐱')+' '+i.name+(tab==='shop'?' · 💗'+i.cost:state.hat===i.id?' ✓':''),()=>{if(tab==='shop'){if(state.coins<i.cost)return;state.coins-=i.cost;state.owned.push(i.id);log('Куплен наряд: '+i.name)}state.hat=i.id;say('Нья! Как мне идёт? ♡');update()},tab==='shop'&&state.coins<i.cost))}p.append(grid);if(!grid.children.length)p.append('Всё куплено! ✨')}else if(tab==='tasks'){const tasks=[['Погладить 5 раз','pats',5,20],['Накормить 5 раз','feeds',5,20],['Поиграть 10 раз','plays',10,50],['Получить 10 подарков','gifts',10,60]];for(const [name,key,need,reward] of tasks){const id=key+'-'+need;const done=state[key]>=need;const claimed=state.claimed.includes(id);const b=button(name+' · '+Math.min(state[key],need)+'/'+need+' · '+(claimed?'Получено ✓':'💗 '+reward),()=>{if(!done||claimed)return;state.claimed.push(id);state.coins+=reward;log('Награда за задание: '+name);say('УРА! Мы справились! ✨');update()},!done||claimed);b.style.width='100%';b.style.marginBottom='7px';p.append(b)}}else if(tab==='diary'){const list=document.createElement('div');for(const t of state.diary){const d=document.createElement('p');d.textContent='🐾 '+t;list.append(d)}p.append(list)}else{const d=document.createElement('p');d.className='note';d.textContent='Прогресс сохраняется автоматически. Можно скачать файл сохранения и восстановить его на другом устройстве.';p.append(d);const exp=button('⬇️ Скачать сохранение',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='narunya-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});p.append(exp);const imp=button('⬆️ Загрузить сохранение',()=>$('importFile').click());p.append(imp);const inp=document.createElement('input');inp.type='file';inp.id='importFile';inp.accept='.json,application/json';inp.onchange=async()=>{try{const parsed=JSON.parse(await inp.files[0].text());if(!Array.isArray(parsed.owned)||typeof parsed.coins!=='number')throw Error();state={...initial(),...parsed};say('Сохранение восстановлено! 💗');update()}catch{alert('Не удалось прочитать сохранение')}};p.append(inp);const reset=button('🔄 Начать заново',()=>{if(confirm('Сбросить весь прогресс Наруньи?')){state=initial();say('Новая история начинается! 🍥');update()}});p.append(reset)}}update();})();
</script></body></html>
